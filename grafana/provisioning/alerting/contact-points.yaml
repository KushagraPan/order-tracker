apiVersion: 1

# Q6: route fired alerts to the incident responder webhook.
# Grafana POSTs {"alerts": [...]} to the responder, which saves evidence
# and starts the headless investigating agent.
contactPoints:
  - orgId: 1
    name: incident-responder
    receivers:
      - uid: incident-responder-webhook
        type: webhook
        settings:
          url: http://responder:8001/alerts
          httpMethod: POST

policies:
  - orgId: 1
    receiver: incident-responder
    group_by:
      - alertname
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
