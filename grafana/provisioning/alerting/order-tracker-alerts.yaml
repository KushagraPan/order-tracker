apiVersion: 1

groups:
  - orgId: 1
    name: order-tracker
    folder: Order Tracker
    interval: 30s
    rules:
      - uid: order-tracker-5xx
        title: OrderTracker5xx
        condition: D
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: sum(rate(http_server_request_count_total{http_route="/api/orders/{order_id}",http_response_status_code=~"5.."}[5m]))
              refId: A
              range: true
              instant: false
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: C
              type: reduce
          - refId: D
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: $C > 0
              refId: D
              type: math
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: HTTP 5xx errors on Order Tracker order lookup endpoint
          description: >-
            Server-side errors (HTTP 500-599) on endpoint /api/orders/{order_id}
            over the last 5 minutes. Query:
            sum(rate(http_server_request_count_total{http_route="/api/orders/{order_id}",http_response_status_code=~"5.."}[5m])) > 0.
            Dashboard: http://localhost:3000/d/order-tracker-requests (Order Tracker - Requests and Errors).
            A 404 on /api/orders/standard-1002 must NOT fire this alert.
          endpoint: /api/orders/{order_id}
          window: 5m
          dashboard: http://localhost:3000/d/order-tracker-requests
        labels:
          severity: critical
          service: order-tracker
          endpoint: /api/orders/{order_id}
